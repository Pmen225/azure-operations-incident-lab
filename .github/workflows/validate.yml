name: Validate lab source

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform -chdir=infra fmt -check
      - name: Install locked providers without a backend
        run: terraform -chdir=infra init -backend=false -input=false -lockfile=readonly
      - name: Validate configuration without Azure credentials
        run: terraform -chdir=infra validate -no-color
      - name: Check load script syntax
        run: bash -n scripts/generate-cpu.sh
      - name: Test load script lifecycle without generating load
        run: python3 -m unittest discover -s tests -v
